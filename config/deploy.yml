service: e_arca_api
image: ghcr.io/sntgrdr/e_arca_api

servers:
  web:
    - YOUR_VPS_IP   # ← replace with real IP from Hetzner

proxy:
  ssl: true
  host: api.yourdomain.com   # ← replace with real API domain

registry:
  server: ghcr.io
  username: sntgrdr
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - E_ARCA_API_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: "true"
    DB_HOST: e_arca_api-db
    CORS_ORIGINS: https://app.yourdomain.com   # ← replace with real frontend domain
    API_HOST: api.yourdomain.com               # ← replace with real API domain
    MAILER_FROM: noreply@yourdomain.com        # ← replace with real from address
    WEB_CONCURRENCY: "2"
    JOB_CONCURRENCY: "2"

accessories:
  db:
    image: postgres:16
    host: YOUR_VPS_IP   # ← same IP as servers.web above
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: e_arca_api
        POSTGRES_DB: e_arca_api_production
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/assets

builder:
  arch: amd64
